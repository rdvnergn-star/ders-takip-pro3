<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#235adb"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Ders Defterim">
<title>Ders Defterim • Ders ve ödeme takibi</title>
<style>
:root{--bg:#f3f6fb;--paper:#fff;--ink:#18263c;--muted:#738198;--blue:#235adb;--line:#e5ebf3;--green:#15805b;--red:#ce4254;--radius:18px}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select{font:inherit}button,select{cursor:pointer}button{border:0}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #8bb6ff;outline-offset:2px}button{transition:background .15s,transform .15s}button:active{transform:translateY(1px)}.shell{max-width:1260px;margin:auto;padding:32px 32px 60px}header{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:28px}.brand{display:flex;align-items:center;gap:13px}.logo{background:var(--blue);color:white;border-radius:15px;padding:10px 15px;font-size:25px;font-weight:800}.brand strong{font-size:21px;letter-spacing:-.6px}.subtitle,.muted{color:var(--muted)}.subtitle{font-size:12px}.save{color:var(--green);font-size:12px}.eyebrow{color:var(--blue);font-weight:700;font-size:11px;letter-spacing:1.5px;text-transform:uppercase}h1{font-size:30px;letter-spacing:-1px;line-height:1.2;margin:9px 0}h2{font-size:17px;margin:0}p{margin:7px 0 0}.heading{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:23px}.primary{background:var(--blue);color:white;border-radius:11px;padding:11px 17px;font-weight:600}.secondary,.icon{background:#eef3fb;color:#42608a;border-radius:9px;padding:8px 12px}.danger{color:var(--red)}.filters{display:flex;gap:9px;align-items:center;flex-wrap:wrap;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:22px}select,input{border:1px solid var(--line);border-radius:9px;background:white;padding:9px;color:var(--ink);min-width:0}.filters label{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}.filters .spacer{flex:1}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:24px}.stat{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:20px}.stat span{color:var(--muted);font-size:12px}.stat strong{display:block;font-size:27px;letter-spacing:-.7px;margin:7px 0}.stat small{color:var(--muted)}.tabs{display:flex;gap:5px;overflow:auto;border-bottom:1px solid var(--line);margin-bottom:23px;padding-bottom:10px}.tab{white-space:nowrap;background:transparent;color:var(--muted);padding:11px 15px;border-radius:10px;font-weight:600}.tab.active{background:#e5edff;color:var(--blue)}.panel{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:22px}.calendar-layout{display:grid;grid-template-columns:1.4fr 1fr;gap:20px}.section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:20px}.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}.dow{text-align:center;color:var(--muted);font-size:11px;padding:6px}.date{background:#f8fafd;border:1px solid transparent;border-radius:11px;min-height:66px;position:relative;color:var(--ink);padding:8px 3px}.date small{display:block;font-size:9px;color:var(--muted)}.date.today{border-color:#9db8fa}.date.selected{background:var(--blue);color:white}.date.selected small{color:#e0e9ff}.dot{display:block;background:#759ae9;width:4px;height:4px;border-radius:50%;margin:4px auto}.date.selected .dot{background:white}.empty{padding:30px 15px;text-align:center;color:var(--muted)}.lesson{padding:15px 0;border-top:1px solid var(--line)}.lesson:first-child{border-top:0}.lesson-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}.name{font-weight:650}.time{font-size:12px;color:var(--muted);margin-top:4px}.amount{font-weight:650;white-space:nowrap}.actions{display:flex;align-items:center;flex-wrap:wrap;gap:5px;margin-top:12px}.icon{padding:5px 9px;font-size:12px}.status{font-size:11px;border-radius:7px;padding:6px 9px;background:#edf0f5;color:#64748b}.status.active{box-shadow:inset 0 0 0 1px currentColor;font-weight:700}.status.paid{background:#e7f6ef;color:var(--green)}.status.unpaid{background:#fff0f1;color:var(--red)}.status.cancelled{background:#f0ebf8;color:#80619a}.days{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:17px;align-items:start}.day h2{font-size:15px}.day .section-head{margin:0 0 8px}.day-label{font-size:11px;color:var(--muted)}.tag{background:#eef3ff;color:var(--blue);border-radius:6px;padding:3px 7px;font-size:11px}.notice{font-size:12px;color:var(--muted);margin:16px 0}.debt{display:flex;justify-content:space-between;gap:15px;align-items:center;padding:19px 0;border-bottom:1px solid var(--line)}.debt:last-child{border-bottom:0}.debt details{font-size:12px;color:var(--muted);margin-top:6px}.debt-right{text-align:right;flex-shrink:0}.debt-right strong{display:block;color:var(--red);font-size:19px;margin-bottom:7px}.report-row{display:flex;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}footer{display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-top:26px;font-size:12px;color:var(--muted)}footer button{background:none;color:var(--muted);padding:0 6px}dialog{border:0;border-radius:22px;padding:26px;width:min(450px,calc(100% - 30px));box-shadow:0 25px 80px #18263c33}dialog::backdrop{background:#18263c77;backdrop-filter:blur(3px)}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:20px 0}.form-grid label{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--muted)}.full{grid-column:1/-1}.dialog-actions{display:flex;justify-content:flex-end;gap:9px}.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:var(--ink);color:white;border-radius:12px;padding:12px 20px;z-index:10;max-width:90%;box-shadow:0 5px 25px #0002}.hidden{display:none!important}progress{width:100%;height:10px;accent-color:var(--green)}@media(max-width:950px){.days{grid-template-columns:repeat(2,minmax(0,1fr))}.calendar-layout{grid-template-columns:1fr 1fr}.shell{padding:24px 20px}}@media(max-width:650px){.shell{padding:20px 15px 40px}header{margin-bottom:25px}.brand strong{font-size:18px}.save{max-width:100px;text-align:right;font-size:10px}h1{font-size:25px}.heading{align-items:flex-start}.heading .primary{font-size:12px;padding:10px;white-space:nowrap}.stats{gap:8px}.stat{padding:13px 10px}.stat strong{font-size:20px}.stat span,.stat small{font-size:10px}.calendar-layout,.days{grid-template-columns:1fr}.panel{padding:17px}.filters{gap:7px}.filters label{flex:1;min-width:80px;display:flex;flex-direction:column;align-items:stretch;gap:4px}.filters label:last-of-type{min-width:110px;flex:1.4}.filters select{width:100%;font-size:12px;padding:9px 5px}.filters #goToday{width:100%;margin-top:3px}.filters .spacer{display:none}.tab{padding:10px;font-size:12px}.date{min-height:58px}.debt{align-items:flex-start}.debt-right .primary{font-size:11px;padding:8px}.subtitle{font-size:11px}}
</style>
</head>
<body>
<div class="shell">
<header><div class="brand"><div class="logo">d.</div><div><strong>Ders Defterim</strong><div class="subtitle">Programın düzenli, aklın rahat.</div></div></div><span class="save" id="saveStatus" role="status">● Bu cihazda kaydediliyor</span></header>
<div class="heading"><div><div class="eyebrow">Kişisel ders asistanın</div><h1 id="greeting">Derslerine bir bakış</h1><p class="muted" id="todayLabel"></p></div><button class="primary" id="add">＋ Yeni ders</button></div>
<div class="filters"><label>Yıl <select id="year" aria-label="Yıl"></select></label><label>Ay <select id="month" aria-label="Ay"></select></label><label>Hafta <select id="week" aria-label="Hafta"></select></label><span class="spacer"></span><button class="secondary" id="goToday">Bugüne dön</button></div>
<div class="stats" id="stats"></div>
<nav class="tabs" aria-label="Ana menü" id="tabs"></nav>
<main id="view"></main>
<footer><span>15 Ekim 2026’dan itibaren · Veriler yalnızca bu tarayıcıda saklanır.</span><div><button id="export">↓ Yedek indir</button><button id="import">↑ Yedek yükle</button></div></footer>
</div>
<dialog id="editor"><form id="lessonForm"><h2 id="editorTitle">Yeni ders ekle</h2><p class="muted">Bu değişiklik yalnızca seçtiğin tarihe uygulanır.</p><div class="form-grid"><label class="full">Öğrenci adı<input id="student" required maxlength="100" autocomplete="off"></label><label class="full">Ders tarihi<input type="date" id="lessonDate" required min="2026-10-15"></label><label>Başlangıç saati<input type="time" id="start"></label><label>Bitiş saati<input type="time" id="end"></label><label class="full">Ders ücreti (TL)<input type="number" id="fee" min="0" step="0.01" placeholder="Belirlenecek"></label></div><p id="formError" role="alert" class="danger"></p><div class="dialog-actions"><button type="button" class="secondary" id="closeEditor">Vazgeç</button><button class="primary">Kaydet</button></div></form></dialog>
<dialog id="confirmDialog"><h2 id="confirmTitle"></h2><p id="confirmText" class="muted"></p><div class="dialog-actions" style="margin-top:22px"><button class="secondary" id="confirmNo">Vazgeç</button><button class="primary" id="confirmYes">Onayla</button></div></dialog>
<input type="file" id="importFile" accept="application/json,.json" hidden><div id="toast" class="toast hidden" role="status"></div>
<script>
'use strict';
const KEY='ders_takip_v5', START='2026-10-15', MONTHS=['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'], DAYS=['Pazar','Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi'];
const $=id=>document.getElementById(id), money=n=>new Intl.NumberFormat('tr-TR',{style:'currency',currency:'TRY',maximumFractionDigits:2}).format(n), esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), pad=n=>String(n).padStart(2,'0'), iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`, date=s=>new Date(s+'T00:00:00'), uid=()=>globalThis.crypto?.randomUUID?.()||Date.now().toString(36)+Math.random().toString(36).slice(2);
const templates=[ [2,'Elif Sena Yazgan','14:00','16:00',2000],[3,'Uygar Ateş Doğan','','',null],[6,'Elif Sena Yazgan','13:30','15:30',2000],[6,'Baran Tuzlacılar','15:30','17:30',2500],[6,'Tuğçe Atak','17:30','18:30',2000],[6,'Ela Ekici','18:30','19:30',2000],[0,'Sadık Çınar Piri','09:00','10:00',1500],[0,'Kerem Akkaya','10:00','12:00',3000],[0,'İpek Lina Dedeoğlu','12:00','14:00',3000],[0,'Bilgin Aktaş','14:00','15:00',2000],[0,'Çınar Ünal','15:00','16:00',2000],[0,'Rabia Buğlem Boydaş','16:00','17:00',2000],[0,'Kayra Öztekin','17:00','19:00',3000] ];
let db={schema:'ders-defterim-v5',months:{},lessons:[]}, storageOK=true, tab='calendar', selected=iso(new Date()), y=new Date().getFullYear(), m=new Date().getMonth(), w=Math.ceil(new Date().getDate()/7), editing=null;
try{const raw=localStorage.getItem(KEY);if(raw){const parsed=JSON.parse(raw);if(!validDB(parsed))throw Error('Mevcut kayıt biçimi tanınmadı. Verilerin korunması için üzerine yazılmadı. Önce yedek indir.');db=parsed;}}catch(e){storageOK=false;setTimeout(()=>toast(e.message,10000),100);}
function validDB(d){return d&&d.schema==='ders-defterim-v5'&&d.months&&typeof d.months==='object'&&!Array.isArray(d.months)&&Array.isArray(d.lessons)&&d.lessons.every(l=>l&&typeof l.id==='string'&&typeof l.name==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(l.date)&&Number.isFinite(date(l.date).getTime())&&typeof l.start==='string'&&typeof l.end==='string'&&[l.start,l.end].every(t=>t===''||/^([01]\d|2[0-3]):[0-5]\d$/.test(t))&&(l.fee===null||typeof l.fee==='number'&&Number.isFinite(l.fee)&&l.fee>=0)&&['pending','paid','unpaid','cancelled'].includes(l.status)&&Number.isFinite(l.order))&&new Set(d.lessons.map(l=>l.id)).size===d.lessons.length;}
function save(){if(!storageOK){$('saveStatus').textContent='⚠ Kayıt engellendi · Yedek alın';return;}try{localStorage.setItem(KEY,JSON.stringify(db));$('saveStatus').textContent='● Tüm değişiklikler kaydedildi';}catch(e){$('saveStatus').textContent='⚠ Kaydedilemedi · Yedek alın';toast('Tarayıcı kaydı başarısız. Verilerinizi yedek indirin.');}}
function ensureMonth(yr,mo){const key=`${yr}-${pad(mo+1)}`;if(db.months[key])return;for(let day=1;day<=new Date(yr,mo+1,0).getDate();day++){const d=new Date(yr,mo,day),ds=iso(d);if(ds<START)continue;templates.forEach((t,i)=>{if(t[0]===d.getDay())db.lessons.push({id:`base-${ds}-${i}`,date:ds,name:t[1],start:t[2],end:t[3],fee:t[4],status:'pending',manual:false,order:i});});}db.months[key]=true;}
function catchUp(){const now=new Date();for(let yr=2026,mo=9;yr<now.getFullYear()||yr===now.getFullYear()&&mo<=now.getMonth();){ensureMonth(yr,mo);if(++mo===12){mo=0;yr++;}}}
function autoStatus(){let changed=false;const now=new Date();db.lessons.forEach(l=>{if(l.status==='pending'&&!l.manual&&l.end&&new Date(l.date+'T'+l.end)<=now){l.status='unpaid';changed=true;}});return changed;}
function listFor(ds){return db.lessons.filter(l=>l.date===ds).sort((a,b)=>a.order-b.order||a.start.localeCompare(b.start));}
function monthList(){return db.lessons.filter(l=>l.date.startsWith(`${y}-${pad(m+1)}`));}
function totals(ls){return {paid:ls.filter(l=>l.status==='paid').reduce((s,l)=>s+(l.fee||0),0),unpaid:ls.filter(l=>l.status==='unpaid').reduce((s,l)=>s+(l.fee||0),0),potential:ls.filter(l=>l.status!=='cancelled').reduce((s,l)=>s+(l.fee||0),0)};}
function toast(msg,ms=3500){$('toast').textContent=msg;$('toast').classList.remove('hidden');clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('toast').classList.add('hidden'),ms);}
function syncFilters(){const years=[...new Set([2026,2027,new Date().getFullYear(),y])].sort();$('year').innerHTML=years.map(v=>`<option ${v===y?'selected':''}>${v}</option>`).join('');$('month').innerHTML=MONTHS.map((s,i)=>`<option value="${i}" ${i===m?'selected':''}>${s}</option>`).join('');$('week').innerHTML=[1,2,3,4,5].map(v=>`<option value="${v}" ${v===w?'selected':''}>${v}. Hafta (${(v-1)*7+1}–${Math.min(v*7,new Date(y,m+1,0).getDate())})</option>`).join('');}
const statuses={pending:'Bekliyor',paid:'Ödendi',unpaid:'Ödenmedi',cancelled:'İptal edildi'};
function statusButtons(l){return `<div class="actions">${Object.entries(statuses).map(([k,v])=>`<button class="status ${k} ${l.status===k?'active':''}" aria-pressed="${l.status===k}" data-action="status" data-id="${esc(l.id)}" data-status="${k}">${v}</button>`).join('')}</div>`;}
function lessonHTML(l,controls=true,pay=false){return `<article class="lesson"><div class="lesson-top"><div><div class="name">${esc(l.name)}</div><div class="time">◷ ${l.start?esc(l.start)+' – '+esc(l.end):'Saat belirlenecek'}${l.start&&l.end?' · '+duration(l):''}</div></div><span class="amount">${l.fee===null?'<span class="muted">—</span>':money(l.fee)}</span></div>${pay?statusButtons(l):`<div class="actions"><span class="status ${l.status}">${statuses[l.status]}</span></div>`}${controls?`<div class="actions"><button class="icon" data-action="edit" data-id="${esc(l.id)}">◷ Saat / ücret</button><button class="icon" data-action="up" data-id="${esc(l.id)}" aria-label="Dersi yukarı taşı">↑</button><button class="icon" data-action="down" data-id="${esc(l.id)}" aria-label="Dersi aşağı taşı">↓</button><button class="icon danger" data-action="delete" data-id="${esc(l.id)}">Sil</button></div>`:''}</article>`;}
function duration(l){const [a,b]=l.start.split(':').map(Number),[c,d]=l.end.split(':').map(Number);return `${c*60+d-a*60-b} dk`;}
function render(){ensureMonth(y,m);autoStatus();save();syncFilters();$('todayLabel').textContent=new Date().toLocaleDateString('tr-TR',{weekday:'long',day:'numeric',month:'long',year:'numeric'});const ls=monthList(),t=totals(ls);$('stats').innerHTML=[['Tahsil edilen',t.paid,'Bu ay alınan ödemeler', 'var(--green)'],['Bekleyen alacak',t.unpaid,'Ödenmedi durumundaki dersler','var(--red)'],['Potansiyel gelir',t.potential,'İptal edilen dersler hariç','var(--ink)']].map(([s,v,h,c])=>`<div class="stat"><span>${s}</span><strong style="color:${c}">${money(v)}</strong><small>${MONTHS[m]} · ${h}</small></div>`).join('');$('tabs').innerHTML=[['calendar','◫ Takvim'],['schedule','Ders Programı'],['payments','Ödeme Takibi'],['debts','Devreden Borçlar'],['report','Gelir Raporu']].map(([k,s])=>`<button class="tab ${k===tab?'active':''}" data-tab="${k}" aria-current="${k===tab?'page':'false'}">${s}</button>`).join('');if(tab==='calendar')renderCalendar();else if(tab==='schedule'||tab==='payments')renderWeek();else if(tab==='debts')renderDebts();else renderReport();}
function renderCalendar(){const count=new Date(y,m+1,0).getDate(),offset=(new Date(y,m,1).getDay()+6)%7;let cells=['Pzt','Sal','Çar','Per','Cum','Cmt','Paz'].map(d=>`<div class="dow">${d}</div>`).join('')+'<span></span>'.repeat(offset);for(let n=1;n<=count;n++){const ds=iso(new Date(y,m,n)),lessons=listFor(ds).filter(l=>l.status!=='cancelled');cells+=`<button class="date ${ds===selected?'selected':''} ${ds===iso(new Date())?'today':''}" data-date="${ds}" aria-label="${n} ${MONTHS[m]}, ${lessons.length} ders" aria-pressed="${ds===selected}">${n}${lessons.length?`<span class="dot"></span><small>${lessons.length} ders</small>`:''}</button>`;}
const daily=listFor(selected);$('view').innerHTML=`<div class="calendar-layout"><section class="panel"><div class="section-head"><div><h2>${MONTHS[m]} ${y}</h2><span class="day-label">Bir gün seç, derslerini görüntüle.</span></div><span class="tag">${monthList().filter(l=>l.status!=='cancelled').length} ders</span></div><div class="calendar">${cells}</div><p class="notice">Hafta seçimi: 1–7, 8–14, 15–21, 22–28 ve 29–ayın sonu.</p></section><section class="panel"><div class="section-head"><div><h2>${date(selected).toLocaleDateString('tr-TR',{day:'numeric',month:'long'})}</h2><span class="day-label">${DAYS[date(selected).getDay()]} · Günün akışı</span></div><button class="secondary" data-add-date="${selected}">＋ Ders</button></div>${daily.length?daily.map(l=>lessonHTML(l,true,true)).join(''):'<div class="empty">Bu gün için ders yok.<br>Yeni bir ders ekleyebilirsin.</div>'}</section></div>`;}
function renderWeek(){let html='';for(let day=(w-1)*7+1;day<=Math.min(w*7,new Date(y,m+1,0).getDate());day++){const ds=iso(new Date(y,m,day)),daily=listFor(ds);html+=`<section class="panel day"><div class="section-head"><div><h2>${DAYS[date(ds).getDay()]}</h2><span class="day-label">${day} ${MONTHS[m]}</span></div><button class="secondary" data-add-date="${ds}" aria-label="${day} ${MONTHS[m]} tarihine ders ekle">＋</button></div>${daily.length?daily.map(l=>lessonHTML(l,true,tab==='payments')).join(''):'<div class="empty">Planlanmış ders yok</div>'}</section>`;}$('view').innerHTML=`<div class="section-head"><h2>${MONTHS[m]} · ${w}. Hafta</h2><span class="day-label">Değişiklikler yalnızca o derse uygulanır.</span></div><div class="days">${html}</div><p class="notice">Bitiş saati geçen dersler otomatik olarak “Ödenmedi” olur. Elle seçtiğin durum korunur; iptal edilen dersler gelir ve borç hesabına katılmaz.</p>`;}
function renderDebts(){const cutoff=iso(new Date(y,m+1,0)),groups=new Map();db.lessons.filter(l=>l.status==='unpaid'&&l.date<=cutoff).sort((a,b)=>a.date.localeCompare(b.date)).forEach(l=>{if(!groups.has(l.name))groups.set(l.name,[]);groups.get(l.name).push(l);});$('view').innerHTML=`<section class="panel"><h2>Öğrenci bazında devreden borçlar</h2><p class="notice">${MONTHS[m]} ${y} sonuna kadar “Ödenmedi” olan tüm dersler. Gelecekteki aylar bu listeye dahil edilmez.</p>${groups.size?[...groups].map(([name,ls])=>`<div class="debt"><div><strong>${esc(name)}</strong><div class="time">${ls.length} ödenmemiş ders${ls.some(l=>l.fee===null)?' · Eksik ücret var':''}</div><details><summary>Dersleri göster</summary>${ls.map(l=>`<div>${date(l.date).toLocaleDateString('tr-TR')} · ${esc(l.start||'Saat yok')} · ${l.fee===null?'Ücret belirlenecek':money(l.fee)}</div>`).join('')}</details></div><div class="debt-right"><strong>${money(ls.reduce((s,l)=>s+(l.fee||0),0))}</strong><button class="primary" data-debt="${esc(name)}">Toplu ödeme al</button></div></div>`).join(''):'<div class="empty">Bu dönem için birikmiş borç bulunmuyor.</div>'}</section>`;}
function renderReport(){const ls=monthList(),t=totals(ls),pending=ls.filter(l=>l.status==='pending').reduce((s,l)=>s+(l.fee||0),0),names=[...new Set(ls.map(l=>l.name))];$('view').innerHTML=`<section class="panel"><h2>${MONTHS[m]} ${y} · Gelir özeti</h2><p class="notice">Tahsil edilen tutar, dersin ait olduğu aya yazılır. İptaller potansiyel gelire dahil edilmez.</p><progress value="${t.paid}" max="${t.potential||1}" aria-label="Tahsilat oranı"></progress><div class="report-row"><span>Tahsilat oranı</span><strong>%${t.potential?Math.round(t.paid/t.potential*100):0}</strong></div><div class="report-row"><span>Henüz vadesi gelmeyen / bekliyor</span><strong>${money(pending)}</strong></div><div class="report-row"><span>İptal edilen ders</span><strong>${ls.filter(l=>l.status==='cancelled').length}</strong></div>${names.map(n=>{const tt=totals(ls.filter(l=>l.name===n));return `<div class="report-row"><span>${esc(n)}</span><span>${money(tt.paid)} <small class="muted">/ ${money(tt.potential)}</small></span></div>`;}).join('')}<p class="notice">${ls.filter(l=>l.fee===null&&l.status!=='cancelled').length} dersin ücreti henüz belirlenmedi. Bu dersler parasal toplamlara eklenmez.</p></section>`;}
function openEditor(l=null,ds=selected){editing=l?.id||null;$('lessonForm').reset();$('editorTitle').textContent=l?'Dersi düzenle':'Yeni ders ekle';$('student').value=l?.name||'';$('lessonDate').value=l?.date||ds;$('start').value=l?.start||'';$('end').value=l?.end||'';$('fee').value=l?.fee??'';$('formError').textContent='';$('editor').showModal();}
function ask(title,msg,fn){$('confirmTitle').textContent=title;$('confirmText').textContent=msg;$('confirmDialog').showModal();$('confirmYes').onclick=()=>{$('confirmDialog').close();fn();};}
$('confirmNo').onclick=()=>$('confirmDialog').close();$('closeEditor').onclick=()=>$('editor').close();$('add').onclick=()=>openEditor();$('goToday').onclick=()=>{const now=new Date();y=now.getFullYear();m=now.getMonth();w=Math.ceil(now.getDate()/7);selected=iso(now);render();};
['year','month','week'].forEach(id=>$(id).onchange=()=>{y=Number($('year').value);m=Number($('month').value);w=Number($('week').value);selected=iso(new Date(y,m,Math.min((w-1)*7+1,new Date(y,m+1,0).getDate())));render();});
$('tabs').onclick=e=>{const b=e.target.closest('[data-tab]');if(b){tab=b.dataset.tab;render();}};
$('view').onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.date){selected=b.dataset.date;w=Math.ceil(date(selected).getDate()/7);render();return;}if(b.dataset.addDate){openEditor(null,b.dataset.addDate);return;}if(b.dataset.debt){const cutoff=iso(new Date(y,m+1,0)),ls=db.lessons.filter(l=>l.name===b.dataset.debt&&l.status==='unpaid'&&l.date<=cutoff);ask('Toplu ödeme al',`${b.dataset.debt}: ${ls.length} ders, toplam ${money(ls.reduce((s,l)=>s+(l.fee||0),0))} ödendi olarak işaretlensin mi?`,()=>{ls.forEach(l=>{l.status='paid';l.manual=true;l.paidAt=new Date().toISOString();});render();toast('Birikmiş borçlar ödendi olarak kaydedildi.');});return;}const l=db.lessons.find(l=>l.id===b.dataset.id);if(!l)return;const action=b.dataset.action;if(action==='edit')openEditor(l);if(action==='delete')ask('Bu dersi sil?',`${l.name} · ${date(l.date).toLocaleDateString('tr-TR')}. Yalnızca bu tarihteki ders silinir.`,()=>{db.lessons=db.lessons.filter(v=>v.id!==l.id);render();toast('Yalnızca seçilen ders silindi.');});if(action==='status'){l.status=b.dataset.status;l.manual=true;if(l.status==='paid')l.paidAt=new Date().toISOString();else delete l.paidAt;render();}if(action==='up'||action==='down'){const ls=listFor(l.date),i=ls.indexOf(l),j=i+(action==='up'?-1:1);if(j<0||j>=ls.length)return;[ls[i],ls[j]]=[ls[j],ls[i]];ls.forEach((v,n)=>v.order=n);render();}};
$('lessonForm').onsubmit=e=>{e.preventDefault();const name=$('student').value.trim(),ds=$('lessonDate').value,st=$('start').value,en=$('end').value,fee=$('fee').value===''?null:Number($('fee').value);if(!name||ds<START||Boolean(st)!==Boolean(en)||st&&en<=st||fee!==null&&(!Number.isFinite(fee)||fee<0)){$('formError').textContent='Adı, tarihi ve ücreti kontrol edin. Her iki saati girin; bitiş başlangıçtan sonra olmalıdır.';return;}ensureMonth(date(ds).getFullYear(),date(ds).getMonth());let l=db.lessons.find(v=>v.id===editing);if(l){Object.assign(l,{name,date:ds,start:st,end:en,fee});if(!l.manual&&l.status==='unpaid'){l.status='pending';}}else db.lessons.push({id:uid(),name,date:ds,start:st,end:en,fee,status:'pending',manual:false,order:listFor(ds).length+20});y=date(ds).getFullYear();m=date(ds).getMonth();w=Math.ceil(date(ds).getDate()/7);selected=ds;$('editor').close();render();toast('Ders yalnızca bu tarih için kaydedildi.');};
function download(content,name){const url=URL.createObjectURL(new Blob([content],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
$('export').onclick=()=>{let content=JSON.stringify(db,null,2);if(!storageOK){try{content=localStorage.getItem(KEY)||content;}catch(e){}}download(content,`ders-defterim-yedek-${iso(new Date())}.json`);};$('import').onclick=()=>$('importFile').click();$('importFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const imported=JSON.parse(await f.text());if(!validDB(imported))throw Error('Bu yedeğin veri biçimi desteklenmiyor. Mevcut veriler korunuyor.');ask('Yedek geri yüklensin mi?','Mevcut kayıtlar önce otomatik indirilecek, ardından seçilen yedek kullanılacak.',()=>{$('export').click();db=imported;storageOK=true;catchUp();render();toast('Yedek geri yüklendi.');});}catch(err){toast(err.message,7000);}e.target.value='';};
window.addEventListener('storage',e=>{if(e.key===KEY){try{const other=JSON.parse(e.newValue);if(validDB(other)){db=other;render();}}catch(err){}}});
setInterval(()=>{if(autoStatus())render();},30000);document.addEventListener('visibilitychange',()=>{if(!document.hidden){catchUp();render();}});
const icon=`<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 192 192"><rect width="192" height="192" rx="42" fill="#235adb"/><text x="36" y="135" fill="white" font-family="Arial" font-size="135" font-weight="bold">d.</text></svg>`,iconURL='data:image/svg+xml,'+encodeURIComponent(icon),manifest={name:'Ders Defterim',short_name:'Derslerim',start_url:location.pathname,display:'standalone',background_color:'#f3f6fb',theme_color:'#235adb',lang:'tr',icons:[{src:iconURL,sizes:'192x192',type:'image/svg+xml',purpose:'any'}]};const manifestLink=document.createElement('link');manifestLink.rel='manifest';manifestLink.href=URL.createObjectURL(new Blob([JSON.stringify(manifest)],{type:'application/manifest+json'}));document.head.append(manifestLink);
catchUp();render();
</script>
</body></html>
